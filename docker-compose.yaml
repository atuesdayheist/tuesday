services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    environment:
      DATABASE_URL: ${$DATABASE_URL}
      PYTHONPATH: /app/api
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-app_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-app_password}
      POSTGRES_DB: ${PGDATABASE:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
