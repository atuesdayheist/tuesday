services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      PYTHONPATH: /app/api
      DATABASE_URL: ${DATABASE_URL}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-app_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-app_password}
      POSTGRES_DB: ${PGDATABASE:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
